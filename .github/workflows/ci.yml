name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets CI be re-run on demand from the Actions tab. Without this, the only
  # way to refresh main's status is to push another commit — which is awkward
  # after a merge, because GitHub suppresses workflow triggers for pushes made
  # through an app integration.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `version:` here on purpose. package.json declares
      # "packageManager": "pnpm@10.33.0", and specifying the version in both
      # places makes action-setup fail with ERR_PNPM_BAD_PM_VERSION.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # vite 7 and vitest 4 require ^20.19 || >=22.12; pin to 22 rather
          # than tracking whatever "20" resolves to.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
