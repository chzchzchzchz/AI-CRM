name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets CI be re-run on demand from the Actions tab. Without this, the only
  # way to refresh main's status is to push another commit — which is awkward
  # after a merge, because GitHub suppresses workflow triggers for pushes made
  # through an app integration.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `version:` here on purpose. package.json declares
      # "packageManager": "pnpm@10.33.0", and specifying the version in both
      # places makes action-setup fail with ERR_PNPM_BAD_PM_VERSION.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # vite 7 and vitest 4 require ^20.19 || >=22.12; pin to 22 rather
          # than tracking whatever "20" resolves to.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      # Rules-of-hooks only. A hook below an early return typechecks, builds and
      # passes every unit test, then renders a blank page at runtime — it happened
      # three times in this repo before this step existed.
      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Regenerates docs/CAPABILITIES.md, then asserts nothing is built-but-unreachable.
      - name: Capability inventory
        run: pnpm inventory

      # Static truth checks: no type below the scale floor, no dead doc links,
      # README figures match the seed, nothing unrouted, no fabricated evidence.
      - name: Check claims
        run: pnpm check:claims

      - name: Build
        run: pnpm build

      # The checks a typecheck structurally cannot make: every route, at desktop and
      # mobile, asserted for tiny text, horizontal overflow, runtime errors, DOM
      # weight and page height. Chromium is fetched here because playwright-core
      # ships without one.
      - name: Install Chromium for the quality gate
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Quality gate
        run: pnpm gate
        env:
          GATE_VERBOSE: "1"

      # The gate above loads every route and measures what rendered — it never
      # clicks anything, so "I tried it and nothing happened" stayed invisible.
      # These use the app: filter a list, open a record, search, walk the nav.
      - name: Flow gate
        run: pnpm flows
