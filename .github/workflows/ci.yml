name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets CI be re-run on demand from the Actions tab. Without this, the only
  # way to refresh main's status is to push another commit — which is awkward
  # after a merge, because GitHub suppresses workflow triggers for pushes made
  # through an app integration.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `version:` here on purpose. package.json declares
      # "packageManager": "pnpm@10.33.0", and specifying the version in both
      # places makes action-setup fail with ERR_PNPM_BAD_PM_VERSION.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # vite 7 and vitest 4 require ^20.19 || >=22.12; pin to 22 rather
          # than tracking whatever "20" resolves to.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      # Rules-of-hooks only. A hook below an early return typechecks, builds and
      # passes every unit test, then renders a blank page at runtime — it happened
      # three times in this repo before this step existed.
      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Regenerates docs/CAPABILITIES.md, then asserts nothing is built-but-unreachable.
      - name: Capability inventory
        run: pnpm inventory

      # Static truth checks: no type below the scale floor, no dead doc links,
      # README figures match the seed, nothing unrouted, no fabricated evidence.
      - name: Check claims
        run: pnpm check:claims

      - name: Build
        run: pnpm build

      # The checks a typecheck structurally cannot make: every route, at desktop and
      # mobile, asserted for tiny text, horizontal overflow, runtime errors, DOM
      # weight and page height. Chromium is fetched here because playwright-core
      # ships without one.
      - name: Install Chromium for the quality gate
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Quality gate
        run: pnpm gate
        env:
          GATE_VERBOSE: "1"

      # The gate above loads every route and measures what rendered — it never
      # clicks anything, so "I tried it and nothing happened" stayed invisible.
      # These use the app: filter a list, open a record, search, walk the nav.
      - name: Flow gate
        run: pnpm flows

      # The flows above run as one signed-in user in one workspace, which is the shape
      # every test in this repo had. This one signs two customers up, has one invite a
      # colleague, and asserts each can only read their own workspace — the thing being
      # sold, walked the way a customer walks it. It runs with SIGNUP_MODE=self-serve
      # against its own database file, so it touches nothing else here.
      - name: Tenancy end to end
        run: pnpm tenancy:e2e

      # Live connector check. With no credentials every connector reports UNVERIFIED
      # and this passes — the app is meant to run without any of them. Add a vendor
      # key as a repository secret below and that connector is exercised against the
      # real tenant on every run from then on, so a vendor changing its response shape
      # breaks the build instead of a sync quietly returning nothing at 3am.
      - name: Connector smoke test
        run: pnpm smoke
        env:
          GONG_ACCESS_KEY: ${{ secrets.GONG_ACCESS_KEY }}
          GONG_ACCESS_KEY_SECRET: ${{ secrets.GONG_ACCESS_KEY_SECRET }}
          GONG_API_KEY: ${{ secrets.GONG_API_KEY }}
          ZOOMINFO_USERNAME: ${{ secrets.ZOOMINFO_USERNAME }}
          ZOOMINFO_PASSWORD: ${{ secrets.ZOOMINFO_PASSWORD }}
          SIXSENSE_API_KEY: ${{ secrets.SIXSENSE_API_KEY }}
          SALESFORCE_CLIENT_ID: ${{ secrets.SALESFORCE_CLIENT_ID }}
          SALESFORCE_CLIENT_SECRET: ${{ secrets.SALESFORCE_CLIENT_SECRET }}
          SALESFORCE_USERNAME: ${{ secrets.SALESFORCE_USERNAME }}
          SALESFORCE_PASSWORD: ${{ secrets.SALESFORCE_PASSWORD }}

  # The Docker path the README advertises — `docker compose up`, and the Render
  # one-click button, which builds this same Dockerfile.
  #
  # It had never been built or booted by anything. A runtime stage that installs
  # --prod only will happily build an image that dies on its first import, and the
  # README's health check path is a string nothing verifies. Separate job so a
  # Docker failure is legible on its own rather than buried in the main run.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t targetdash:ci .

      - name: Boot it exactly as the README says
        run: docker run -d --name targetdash -p 3333:3333 targetdash:ci

      # The path is READ OUT OF render.yaml, not copied here. Render gates every deploy
      # on healthCheckPath, so a typo in it is a disabled deploy gate — and until the
      # /api 404 handler existed, a mistyped path answered 200 with the app's HTML, so
      # the typo would never have been noticed. Polling whatever render.yaml actually
      # says makes the two agree or fails the build.
      #
      # It points at /api/ready, which probes the database and the auth-state store and
      # returns 503 when either is unreachable. Polling liveness only proved the process
      # was listening — an image that boots and cannot serve a request passed.
      - name: Wait for the health check Render relies on
        run: |
          path=$(sed -n 's/^ *healthCheckPath: *//p' render.yaml | head -1)
          if [ -z "$path" ]; then
            echo "::error::render.yaml has no healthCheckPath — the deploy has no health gate"
            exit 1
          fi
          echo "render.yaml gates deploys on ${path}"
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:3333${path}" > /dev/null; then
              echo "ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::${path} never came up — the Render one-click deploy would never go live"
          docker logs targetdash
          exit 1

      - name: Sign in with the credentials the README prints
        run: |
          body=$(curl -fsS -X POST http://localhost:3333/api/trpc/auth.login \
            -H 'Content-Type: application/json' \
            -d '{"json":{"email":"demo@ai-crm.com","password":"DemoPass123!"}}')
          echo "$body"
          echo "$body" | grep -q '"success":true' || {
            echo "::error::the documented demo credentials do not work in the image"
            docker logs targetdash
            exit 1
          }

      - name: The dashboard has data in it
        run: |
          count=$(curl -fsS http://localhost:3333/api/trpc/accounts.getStats \
            | grep -o '"totalAccounts":[0-9]*' | head -1 | cut -d: -f2)
          echo "accounts: ${count:-0}"
          # A container that boots to an empty database is a demo of nothing.
          [ "${count:-0}" -gt 100 ] || {
            echo "::error::the image booted but the demo dataset is missing"
            docker logs targetdash
            exit 1
          }

      - name: Container logs
        if: always()
        run: docker logs targetdash 2>&1 | tail -40
