# One-command self-host.
#
#   docker compose up                                   → zero-config demo at :3333
#   DEMO_MODE=false docker compose --profile full up    → app + persistent MySQL (real data)
#
# After the first `--profile full` boot, create the schema once:
#   docker compose exec app pnpm db:push
#
services:
  app:
    build: .
    ports:
      - "3333:3333"
    environment:
      # Demo by default; set DEMO_MODE=false (with the 'full' profile) for real data.
      DEMO_MODE: "${DEMO_MODE:-true}"
      # Defaults to the bundled MySQL below; demo mode ignores it.
      DATABASE_URL: "${DATABASE_URL:-mysql://root:targetdash@db:3306/targetdash}"
      # Required once DEMO_MODE=false: the server refuses to start outside demo mode
      # with a missing or placeholder secret. Generate one with:
      #   JWT_SECRET="$(openssl rand -base64 48)" DEMO_MODE=false docker compose --profile full up
      JWT_SECRET: "${JWT_SECRET:-}"
      # --- Optional integrations (see ADMIN_SETUP.md) ---
      # OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # SIXSENSE_API_KEY: "${SIXSENSE_API_KEY:-}"
      # CLAY_WEBHOOK_SECRET: "${CLAY_WEBHOOK_SECRET:-}"
    depends_on:
      db:
        condition: service_healthy
        required: false          # db only exists in the 'full' profile
    restart: unless-stopped

  # Persistent MySQL — only started with:  docker compose --profile full up
  db:
    image: mysql:8
    profiles: ["full"]
    environment:
      MYSQL_ROOT_PASSWORD: targetdash
      MYSQL_DATABASE: targetdash
    ports:
      - "3306:3306"
    volumes:
      - targetdash-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptargetdash"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

volumes:
  targetdash-db:
