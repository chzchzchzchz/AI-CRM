# One-click deploy to Render (https://render.com).
# Click the "Deploy to Render" button in the README, or point Render at this repo
# as a Blueprint. Builds the Dockerfile and serves the zero-config demo on a
# public URL. For real data, set DEMO_MODE=false + DATABASE_URL in the Render
# dashboard (see ADMIN_SETUP.md).
services:
  - type: web
    name: targetdash
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # /api/ready, not /api/health. Render's health check is the only gate on whether a
    # deploy goes live, which is the readiness question by definition — a deploy that
    # cannot reach its database should roll back, not replace a working one. Pointed at
    # liveness it gated on "the process is listening", so a deploy with a wrong
    # DATABASE_URL passed and went live serving errors.
    #
    # The trade-off, stated honestly: Render also restarts an instance that keeps failing
    # this check, so a long database outage will restart this service. On a single
    # instance that costs a few seconds and changes nothing; if you scale out, point this
    # back at /api/health and put /api/ready on the load balancer instead.
    healthCheckPath: /api/ready
    envVars:
      - key: DEMO_MODE
        value: "true"
      # Render injects PORT automatically; the server binds to it.
      # Add integration keys here (or in the dashboard) when you go live:
      # - key: DATABASE_URL
      #   sync: false
      # - key: OPENAI_API_KEY
      #   sync: false
      # - key: SIXSENSE_API_KEY
      #   sync: false
      # - key: CLAY_WEBHOOK_SECRET
      #   sync: false
